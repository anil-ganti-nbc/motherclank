name: fleet-laws

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: motherclank
      - uses: actions/checkout@v4
        with:
          repository: anil-ganti-nbc/clank-architecture
          ref: main
          path: clank-architecture
      - uses: actions/checkout@v4
        with:
          repository: anil-ganti-nbc/diagnostic-clank
          ref: diagnostic-clank-2026-08
          path: diagnostic-clank
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fleet Laws conformance + M0 tests
        run: |
          pip install pytest pyyaml pydantic
          pytest clank-architecture/conformance -q
          pytest motherclank/tests -q
