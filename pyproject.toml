[project]
name = "motherclank"
version = "0.1.0"
description = "Motherclank M0: read-only fleet harvester per ADR-0002 (clank-architecture)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
motherclank = "motherclank.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
